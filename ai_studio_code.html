<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minh Đức Shop - Deal Shopee 2026</title>
    <!-- SEO & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --shopee: #EE4D2D; --bg: #F5F5F5; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.4; }
        a { text-decoration: none; color: inherit; }

        /* Top Bar Contact */
        .top-bar { background: #222; color: white; padding: 8px 15px; font-size: 12px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .top-bar a:hover { color: var(--shopee); }

        /* Header */
        header { background: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .logo { font-size: 24px; font-weight: 800; color: var(--shopee); text-transform: uppercase; letter-spacing: -1px; }

        /* Thanh lọc hạng mục - Menu */
        .category-wrapper { background: white; border-bottom: 1px solid #eee; position: sticky; top: 62px; z-index: 999; overflow-x: auto; white-space: nowrap; padding: 10px 0; }
        .category-wrapper::-webkit-scrollbar { display: none; }
        .cat-container { display: flex; justify-content: center; gap: 10px; padding: 0 15px; }
        .cat-item { 
            padding: 8px 18px; background: #f0f0f0; border-radius: 20px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .cat-item.active { background: var(--shopee); color: white; box-shadow: 0 4px 10px rgba(238, 77, 45, 0.2); }

        /* Danh sách sản phẩm */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 10px; min-height: 60vh; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        /* Card sản phẩm */
        .card { background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #eee; transition: 0.3s; }
        .card.hidden { display: none; } /* Dùng để ẩn sản phẩm khi lọc */
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        
        .img-box { width: 100%; aspect-ratio: 1/1; background: #f9f9f9; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .title { font-size: 14px; font-weight: 600; color: #333; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px; }
        .prices { margin-bottom: 12px; }
        .old-p { text-decoration: line-through; color: #999; font-size: 12px; display: block; }
        .new-p { color: var(--shopee); font-size: 18px; font-weight: 800; }
        
        .btn-buy { background: var(--shopee); color: white; text-align: center; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 13px; }

        /* Thông báo */
        #loading { text-align: center; padding: 100px; color: #888; font-weight: 600; }
        footer { background: #111; color: #666; padding: 40px 20px; text-align: center; margin-top: 40px; font-size: 13px; }

        /* Giao diện điện thoại */
        @media (max-width: 600px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .cat-container { justify-content: flex-start; }
            .logo { font-size: 20px; }
            .title { font-size: 13px; height: 36px; }
            .new-p { font-size: 17px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>📞 0822611300</span> | <span>👤 FB: minh.uc.43365</span> | <span>✉️ minhducduong2406@gmail.com</span>
    </div>

    <header>
        <a href="/" class="logo">MINH ĐỨC SHOP</a>
    </header>

    <nav class="category-wrapper">
        <div class="cat-container" id="category-nav">
            <button class="cat-item active" onclick="filterData(this, 'all')">Tất cả</button>
            <!-- Hạng mục tự động thêm ở đây -->
        </div>
    </nav>

    <main class="container">
        <div id="loading">🔄 Đang tải deal ngon 2026...</div>
        <div class="product-grid" id="product-list"></div>
    </main>

    <footer>
        <p>© 2026 <b>MINH ĐỨC SHOP</b>. All rights reserved.</p>
        <p style="margin-top: 5px; opacity: 0.5;">Cập nhật tự động từ Google Sheets</p>
    </footer>

    <script>
        // Cấu hình link dữ liệu
        const SHEET_ID = '1vTSfjCVCxt7Cp5GqhN4wC5wg07VQNRuGW4d2zUtyMI4Hb03Vm7okSScD-2Ns37xLTEeE1t8wFfVybIB';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-${SHEET_ID}/pub?gid=0&single=true&output=csv`;

        async function startApp() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                
                const list = document.getElementById('product-list');
                const nav = document.getElementById('category-nav');
                const loading = document.getElementById('loading');
                
                let categories = new Set();
                let html = '';

                rows.forEach(row => {
                    // Tách cột CSV
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (cols.length >= 6) {
                        const cat = cols[0].replace(/^"|"$/g, '').trim(); // A
                        const name = cols[1].replace(/^"|"$/g, '').trim(); // B
                        const link = cols[2].replace(/^"|"$/g, '').trim(); // C
                        const img = cols[3].replace(/^"|"$/g, '').trim(); // D
                        const oldP = cols[4].replace(/^"|"$/g, '').trim(); // E
                        const newP = cols[5].replace(/^"|"$/g, '').trim(); // F

                        if (name && img.includes('http')) {
                            if(cat) categories.add(cat);
                            html += `
                                <div class="card" data-category="${cat}">
                                    <div class="img-box">
                                        <img src="${img}" alt="${name}" loading="lazy">
                                    </div>
                                    <div class="info">
                                        <h3 class="title">${name}</h3>
                                        <div class="prices">
                                            <span class="old-p">${oldP}</span>
                                            <span class="new-p">${newP}</span>
                                        </div>
                                        <a href="${link}" target="_blank" class="btn-buy">MUA NGAY</a>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                // Hiển thị menu hạng mục
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'cat-item';
                    btn.innerText = cat;
                    btn.onclick = function() { filterData(this, cat); };
                    nav.appendChild(btn);
                });

                loading.style.display = 'none';
                list.innerHTML = html;

            } catch (error) {
                document.getElementById('loading').innerHTML = "❌ Lỗi: Không thể tải dữ liệu. Hãy kiểm tra link chia sẻ.";
            }
        }

        // Hàm lọc sản phẩm (Chắc chắn hoạt động)
        function filterData(btn, category) {
            // Đổi màu nút
            document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Lọc card
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        startApp();
    </script>
</body>
</html>
